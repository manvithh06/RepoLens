<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Paste a public GitHub repository URL and see which files RepoLens keeps for analysis and which it skips."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>RepoLens</title>
    <script>
      (function () {
        var theme = 'light'
        try {
          var saved = localStorage.getItem('repolens-theme')
          if (saved === 'light' || saved === 'dark') {
            theme = saved
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark'
          }
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
