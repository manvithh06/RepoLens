services:
  - type: web
    name: repolens-api
    runtime: docker
    rootDir: backend
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        sync: false

  - type: web
    name: repolens-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
